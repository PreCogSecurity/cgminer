# One-command startup for cgminer.
#
#   docker compose up --build
#
# Override the pool settings via the environment or by editing `command`.
# See the README "Running with Docker" section for details.

services:
  cgminer:
    build: .
    image: cgminer:latest
    working_dir: /app
    # The image entrypoint is the miner itself, so `command` only carries the
    # pool arguments. No port is published because cgminer opens no listener,
    # and the source tree is not bind mounted over /app because that would hide
    # the compiled binary and the OpenCL kernels shipped in the image.
    # Replace POOL_URL / USERNAME / PASSWORD with your pool credentials.
    # Example: stratum+tcp://pool.example.com:3333
    command:
      - --keccak
      - -o
      - ${CGMINER_POOL_URL:-stratum+tcp://pool.example.com:3333}
      - -u
      - ${CGMINER_POOL_USER:-username.worker}
      - -p
      - ${CGMINER_POOL_PASS:-x}
    restart: unless-stopped
